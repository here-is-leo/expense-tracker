<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Expense Tracker — personal finance, clearly in view</title>
  <desc id="desc">Dark gradient banner with a stylized financial dashboard, chart, and completed release label.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1224"/><stop offset=".55" stop-color="#111936"/><stop offset="1" stop-color="#102840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#55E6B5"/><stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#3ABF98"/><stop offset="1" stop-color="#71EAD1"/>
    </linearGradient>
    <linearGradient id="donut" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#57E4BC"/><stop offset="1" stop-color="#3CA6DD"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020817" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8EA6CF" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="480" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="480" fill="url(#bg)"/>
    <circle cx="1030" cy="40" r="210" fill="#297EBB" opacity=".17" filter="url(#glow)"/>
    <circle cx="385" cy="430" r="190" fill="#34CDA0" opacity=".12" filter="url(#glow)"/>
    <rect width="1200" height="480" fill="url(#grid)"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="66" y="58" width="202" height="31" rx="15.5" fill="#173E40" stroke="#3BBF9C" stroke-opacity=".45"/>
      <circle cx="84" cy="73.5" r="4" fill="#5AF2BC"/>
      <text x="98" y="78" fill="#A7F3D0" font-size="12" font-weight="700" letter-spacing="1.8">CORE RELEASE · 100%</text>

      <text x="66" y="162" fill="#F5FAFF" font-size="58" font-weight="800" letter-spacing="-2">Expense</text>
      <text x="66" y="223" fill="url(#accent)" font-size="58" font-weight="800" letter-spacing="-2">Tracker.</text>
      <rect x="67" y="243" width="54" height="4" rx="2" fill="#5DE5BC"/>
      <text x="66" y="288" fill="#CFD9E9" font-size="21" font-weight="400">Make money make sense.</text>
      <text x="66" y="323" fill="#91A5BF" font-size="15">Track every transaction. See the bigger picture.</text>

      <rect x="66" y="370" width="147" height="37" rx="18.5" fill="#1B3551" stroke="#4DBBC4" stroke-opacity=".35"/>
      <text x="91" y="394" fill="#D4FBEC" font-size="13" font-weight="700">ASP.NET Core 8</text>
      <rect x="225" y="370" width="91" height="37" rx="18.5" fill="#1B3551" stroke="#4DBBC4" stroke-opacity=".35"/>
      <text x="248" y="394" fill="#D4FBEC" font-size="13" font-weight="700">React</text>
      <rect x="328" y="370" width="105" height="37" rx="18.5" fill="#1B3551" stroke="#4DBBC4" stroke-opacity=".35"/>
      <text x="351" y="394" fill="#D4FBEC" font-size="13" font-weight="700">SQL Server</text>

      <g filter="url(#shadow)">
        <rect x="604" y="52" width="532" height="384" rx="22" fill="#17243B" stroke="#334765"/>
        <rect x="604" y="52" width="532" height="49" rx="22" fill="#1D2D46"/>
        <path d="M604 78V101H1136V78" fill="#1D2D46"/>
        <circle cx="631" cy="77" r="5" fill="#F87171"/>
        <circle cx="648" cy="77" r="5" fill="#FBBF24"/>
        <circle cx="665" cy="77" r="5" fill="#54D8A9"/>
        <text x="696" y="82" fill="#94A8C1" font-size="12" letter-spacing="1.2">OVERVIEW / DASHBOARD</text>

        <rect x="627" y="120" width="149" height="78" rx="13" fill="#213550"/>
        <text x="642" y="146" fill="#93A9C3" font-size="11">TOTAL BALANCE</text>
        <text x="642" y="176" fill="#F7FAFF" font-size="24" font-weight="700">$24,860</text>
        <rect x="787" y="120" width="149" height="78" rx="13" fill="#213550"/>
        <text x="802" y="146" fill="#93A9C3" font-size="11">INCOME</text>
        <text x="802" y="176" fill="#67E6B5" font-size="24" font-weight="700">+$8,240</text>
        <rect x="947" y="120" width="166" height="78" rx="13" fill="#213550"/>
        <text x="962" y="146" fill="#93A9C3" font-size="11">EXPENSES</text>
        <text x="962" y="176" fill="#FFC38B" font-size="24" font-weight="700">−$3,180</text>

        <rect x="627" y="211" width="299" height="196" rx="13" fill="#1D2E47"/>
        <text x="646" y="240" fill="#E3ECF8" font-size="13" font-weight="700">Monthly activity</text>
        <path d="M648 275H906M648 312H906M648 349H906" stroke="#516581" stroke-opacity=".24" stroke-dasharray="3 5"/>
        <path d="M648 359C678 350 686 329 716 337S763 304 791 309 839 267 869 281 890 252 906 260" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M648 359C678 350 686 329 716 337S763 304 791 309 839 267 869 281 890 252 906 260V378H648Z" fill="#46C8A2" opacity=".08"/>
        <circle cx="906" cy="260" r="5" fill="#75F5C9" stroke="#1D2E47" stroke-width="3"/>
        <text x="648" y="393" fill="#8298B4" font-size="10">JAN</text><text x="712" y="393" fill="#8298B4" font-size="10">FEB</text><text x="776" y="393" fill="#8298B4" font-size="10">MAR</text><text x="840" y="393" fill="#8298B4" font-size="10">APR</text><text x="894" y="393" fill="#8298B4" font-size="10">MAY</text>

        <rect x="938" y="211" width="175" height="196" rx="13" fill="#1D2E47"/>
        <text x="955" y="240" fill="#E3ECF8" font-size="13" font-weight="700">Spending</text>
        <circle cx="1025" cy="306" r="45" fill="none" stroke="#354966" stroke-width="18"/>
        <circle cx="1025" cy="306" r="45" fill="none" stroke="url(#donut)" stroke-width="18" stroke-dasharray="180 283" transform="rotate(-90 1025 306)"/>
        <circle cx="1025" cy="306" r="45" fill="none" stroke="#F5B87E" stroke-width="18" stroke-dasharray="68 283" stroke-dashoffset="-188" transform="rotate(-90 1025 306)"/>
        <text x="1025" y="311" fill="#F0F7FF" font-size="16" font-weight="700" text-anchor="middle">100%</text>
        <circle cx="962" cy="384" r="4" fill="#62E3BC"/><text x="972" y="388" fill="#9EB3CA" font-size="10">Tracked</text>
      </g>
    </g>
  </g>
</svg>
